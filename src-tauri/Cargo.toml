[package]
name = "headway"
version = "1.1.3"
description = "Standalone roadmap planning tool"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = { version = "2", features = ["watch"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
tauri-plugin-http = "2"
# Not used directly: enables native-root TLS on the http plugin's reqwest so
# corporate TLS-inspection CAs (Netskope, Zscaler) in the OS trust store are
# honoured. Without this reqwest trusts only bundled Mozilla roots.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"

[profile.release]
codegen-units = 1
lto = true
strip = true
